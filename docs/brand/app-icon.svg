<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A2C22"/>
      <stop offset="1" stop-color="#17110D"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#C8441F" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#C8441F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBF7EE"/>
      <stop offset="0.6" stop-color="#F3EBDB"/>
      <stop offset="1" stop-color="#E4D6BC"/>
    </linearGradient>
    <linearGradient id="curl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E9DCC3"/>
      <stop offset="1" stop-color="#C9B593"/>
    </linearGradient>
    <radialGradient id="wax" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#D24A3C"/>
      <stop offset="0.55" stop-color="#A62E26"/>
      <stop offset="1" stop-color="#6E1A16"/>
    </radialGradient>
    <radialGradient id="waxInner" cx="0.6" cy="0.65" r="0.7">
      <stop offset="0" stop-color="#B8382E"/>
      <stop offset="1" stop-color="#7C1F19"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <filter id="sealShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#2A0806" flood-opacity="0.5"/>
    </filter>
    <clipPath id="tileClip"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>

  <!-- tile -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)"/>
  <g clip-path="url(#tileClip)">
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>
  </g>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="3"/>

  <!-- sheet -->
  <g transform="rotate(-6 512 520)" filter="url(#shadow)">
    <path d="M300 230 H690 L724 264 V770 H300 Z" fill="url(#paper)"/>
    <!-- dog-ear curl at top right -->
    <path d="M690 230 V258 Q690 264 696 264 H724 Z" fill="url(#curl)"/>
    <!-- heading -->
    <rect x="352" y="306" width="250" height="34" rx="9" fill="#17130F"/>
    <!-- body lines -->
    <g fill="#6B6155">
      <rect x="352" y="398" width="320" height="14" rx="7"/>
      <rect x="352" y="436" width="296" height="14" rx="7"/>
      <rect x="352" y="474" width="314" height="14" rx="7"/>
      <rect x="352" y="512" width="210" height="14" rx="7"/>
    </g>
    <!-- filigree rule -->
    <g fill="none" stroke="#A89C8B" stroke-width="4" stroke-linecap="round">
      <path d="M380 568 H490"/>
      <path d="M534 568 H644"/>
    </g>
    <path d="M512 556 L524 568 L512 580 L500 568 Z" fill="#C8441F"/>
    <g fill="#6B6155">
      <rect x="352" y="612" width="230" height="14" rx="7"/>
      <rect x="352" y="650" width="160" height="14" rx="7"/>
    </g>
  </g>

  <!-- wax seal -->
  <g transform="translate(676 690)" filter="url(#sealShadow)">
    <path d="M0 -118 C26 -120 40 -104 62 -100 C86 -96 104 -82 108 -58 C112 -36 124 -20 120 4 C116 28 122 46 108 66 C94 86 82 104 58 110 C34 116 18 124 -6 120 C-30 116 -48 124 -68 110 C-88 96 -102 82 -110 58 C-118 34 -124 18 -120 -6 C-116 -30 -120 -48 -104 -68 C-88 -88 -74 -100 -50 -108 C-28 -116 -20 -116 0 -118 Z" fill="url(#wax)"/>
    <circle r="78" fill="url(#waxInner)"/>
    <circle r="78" fill="none" stroke="#5A130F" stroke-opacity="0.55" stroke-width="5"/>
    <circle r="68" fill="none" stroke="#F6E2B3" stroke-opacity="0.35" stroke-width="2.5"/>
    <text x="0" y="34" text-anchor="middle" font-family="Iowan Old Style, Palatino, 'Palatino Linotype', 'Book Antiqua', Georgia, serif" font-size="104" font-weight="700" fill="#F6E2B3">P</text>
    <!-- highlight -->
    <path d="M-80 -60 C-60 -92 -24 -104 8 -102" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="10" stroke-linecap="round"/>
  </g>
</svg>
