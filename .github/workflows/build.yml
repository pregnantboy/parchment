name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  # Publishing a release on GitHub (Releases > Draft a new release) builds that version
  # and attaches Parchment.dmg to it. The workflow never creates a release itself: it used
  # to, on every v* tag, and then GitHub refused the release being written by hand for
  # the same tag ("a release with this tag already exists").
  release:
    types: [published]

# A newer push to the same branch cancels the older run, to save macOS minutes.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    permissions:
      # Needed to attach the app to a release.
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Test ParchmentCore
        run: swift test --package-path Packages/ParchmentCore

      - name: Set version
        run: |
          # A release tagged v1.2.0 makes the app report version 1.2.0; branch builds keep project.yml's.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION_ARGS=MARKETING_VERSION=${GITHUB_REF_NAME#v} CURRENT_PROJECT_VERSION=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi

      - name: Build app
        run: |
          set -o pipefail
          xcodebuild -project Parchment.xcodeproj -scheme Parchment \
            -destination 'generic/platform=macOS' -configuration Release \
            -derivedDataPath build ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO $VERSION_ARGS build 2>&1 | tee build.log | { grep -E 'error:|warning:|BUILD' || true; }
          # pipefail makes this step fail when xcodebuild fails; the grep alone never does.
          test -x build/Build/Products/Release/Parchment.app/Contents/MacOS/Parchment

      - name: Package app
        run: |
          # Apple Silicon refuses to launch completely unsigned apps, so sign ad hoc.
          codesign --force --deep --sign - build/Build/Products/Release/Parchment.app
          # A disk image with the app next to a shortcut to Applications, to drag across.
          # ditto keeps the app's symlinks and signature.
          mkdir dmg
          ditto build/Build/Products/Release/Parchment.app dmg/Parchment.app
          ln -s /Applications dmg/Applications
          # hdiutil sometimes fails with "Resource busy" on CI machines; a retry gets through.
          for attempt in 1 2 3 4 5; do
            hdiutil create -volname Parchment -srcfolder dmg -fs HFS+ -format UDZO -ov Parchment.dmg && break
            [ "$attempt" -lt 5 ] || exit 1
            sleep 5
          done
          hdiutil verify Parchment.dmg

      - name: Upload app
        # archive: false uploads Parchment.dmg as-is, instead of wrapping it in a zip.
        uses: actions/upload-artifact@v7
        with:
          path: Parchment.dmg
          archive: false
          retention-days: 14

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          # The asset keeps the plain name Parchment.dmg, so this link always gets the newest:
          # https://github.com/<owner>/<repo>/releases/latest/download/Parchment.dmg
          # --clobber replaces the file when the run is started again for the same release.
          gh release upload "$TAG" Parchment.dmg --clobber

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
