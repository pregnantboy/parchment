name: Build

on:
  push:
  pull_request:

# A newer push to the same branch cancels the older run, to save macOS minutes.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Test ParchmentCore
        run: swift test --package-path Packages/ParchmentCore

      - name: Build app
        run: |
          set -o pipefail
          xcodebuild -project Parchment.xcodeproj -scheme Parchment \
            -destination 'generic/platform=macOS' -configuration Release \
            -derivedDataPath build ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log | { grep -E 'error:|warning:|BUILD' || true; }
          # pipefail makes this step fail when xcodebuild fails; the grep alone never does.
          test -x build/Build/Products/Release/Parchment.app/Contents/MacOS/Parchment

      - name: Package app
        run: |
          # Apple Silicon refuses to launch completely unsigned apps, so sign ad hoc.
          codesign --force --deep --sign - build/Build/Products/Release/Parchment.app
          ditto -c -k --keepParent build/Build/Products/Release/Parchment.app Parchment.zip

      - name: Upload app
        # archive: false uploads Parchment.zip as-is. Without it, GitHub wraps the
        # zip in a second zip, so people unzip once and find another zip.
        # Keep the ditto zip above: it preserves the app's symlinks and signature.
        uses: actions/upload-artifact@v7
        with:
          path: Parchment.zip
          archive: false
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
